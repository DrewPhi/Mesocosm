[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-mesocosm"
version = "0.1.0"
description = "Persistent, model-independent agent world and replay laboratory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eden = "eden.cli:main"

[tool.setuptools.package-data]
eden = ["static/*"]

[tool.setuptools.packages.find]
include = ["eden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
